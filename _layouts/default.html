<!doctype html>
<html lang="{{ site.lang | default: 'zh-TW' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ site.description }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <div class="page-shell">
      <header class="site-hero" aria-label="Site introduction">
        <div class="hero-top">
          <div class="hero-kicker">Dictionary of AI Coding</div>
        </div>
        <div class="hero-grid">
          <div class="hero-content">
            <p class="eyebrow">繁體中文譯本</p>
            <h1>{{ site.title }}</h1>
            <p class="hero-copy">{{ site.description }}</p>
          </div>
          <div class="hero-side" aria-hidden="true">
            <div class="hero-art">
              <img src="{{ '/assets/images/hero-ornament-v1.webp' | relative_url }}" alt="">
            </div>
          </div>
        </div>
      </header>

      <main class="content-card" id="content">
        {{ content }}
      </main>

      <footer class="site-footer" aria-label="Site footer" style="padding: 20px; margin-top: 40px; border-top: 1px solid rgb(51, 51, 51); display: flex; justify-content: space-between; align-items: center; background-color: rgb(26, 26, 26); color: rgb(204, 204, 204); border-radius: 8px;">
        <a class="footer-repo" href="https://github.com/doggy8088/dictionary-of-ai-coding" style="color: rgb(74, 158, 255); text-decoration: none;">doggy8088/dictionary-of-ai-coding</a>
        <div class="footer-credits">
          <span>Credit：<a href="https://github.com/mattpocock" style="color: rgb(74, 158, 255); text-decoration: none;">Matt Pocock</a></span>
          <span>中文翻譯：<a href="https://www.facebook.com/will.fans/" target="_blank">Will 保哥的技術交流中心</a></span>
        </div>
      </footer>
    </div>
  </body>
</html>
