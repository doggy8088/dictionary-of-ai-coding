<!doctype html>
<html lang="{{ site.lang | default: 'zh-TW' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ site.description }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <div class="page-shell">
      <header class="site-hero" aria-label="Site introduction">
        <div class="hero-top">
          <div class="hero-kicker">Dictionary of AI Coding</div>
        </div>
        <div class="hero-grid">
          <div class="hero-content">
            <p class="eyebrow">繁體中文譯本</p>
            <h1>{{ site.title }}</h1>
            <p class="hero-copy">{{ site.description }}</p>
          </div>
          <div class="hero-side" aria-hidden="true">
            <div class="hero-art">
              <img src="{{ '/assets/images/hero-ornament-v1.webp' | relative_url }}" alt="">
            </div>
          </div>
        </div>
      </header>

      <main class="content-card" id="content">
        {{ content }}
      </main>
    </div>
  </body>
</html>
